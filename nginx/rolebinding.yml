

kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: read-pods
  namespace: nginx
subjects:
 - kind: User
   name: adam  # "name" is case sensitive
   apiGroup: rbac.authorization.k8s.io
roleRef:
  # "roleRef" specifies the building to a Role/ ClusterRole 
  kind: Role # this must be Role or ClusteRole
  name: pod-reader # this must match the name of the Role or ClusterRole
  apiGroup: rbac.authorization.k8s.io

