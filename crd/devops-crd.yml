kind: CustomResourceDefinition
apiVersion: apiextensions.k8s.io/v1
metadata:
  name: devopsbatches.trainwithshubham.com
spec:
  group: trainwithshubham.com
  names:
    plural: devopsbatches
    singular: devopsbatch
    kind: DevopsBatch
    shortNames: 
      - junoon
      - batches
      - tws
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                  description: "this is name of the devops batch"
                duration: 
                  type: string
                  description: "this is the duration of the devops batch"
                mode: 
                 type: string
                 description: "this is the mode of the batch eg. Live/Recording"
                platform:
                   type: string
                   description: "this is the platform of the batch"

